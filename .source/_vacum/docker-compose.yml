services:
  vaultwarden:
    image: vaultwarden/server:1.37.1
    restart: unless-stopped
    env_file: /run/vaultwarden/secrets/vaultwarden.env
    volumes:
      - vaultwarden-data:/data
    networks: [private]
    healthcheck:
      test: [CMD, curl, -f, http://localhost/alive]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  cloudflared:
    image: cloudflare/cloudflared:2026.7.3
    restart: unless-stopped
    env_file: /run/vaultwarden/secrets/cloudflared.env
    command: tunnel run
    networks: [private]
    depends_on: [vaultwarden]

  ntfy:
    image: binwiederhier/ntfy:v2.26.3
    restart: unless-stopped
    command: serve
    volumes:
      - ntfy-data:/var/cache/ntfy
      - ntfy-config:/etc/ntfy
    networks: [private]

  backup-svc:
    build:
      context: .bkp
      network: host
    restart: unless-stopped
    env_file: /run/vaultwarden/secrets/backup.env
    volumes:
      - vaultwarden-data:/data:ro
      - backup-stage:/stage
    networks: [private]
    depends_on: [vaultwarden, ntfy]

volumes:
  vaultwarden-data:
  ntfy-data:
  ntfy-config:
  backup-stage:

networks:
  private:
